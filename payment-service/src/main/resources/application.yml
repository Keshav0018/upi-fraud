spring:
  application:
    name: payment-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:payments_db}
    username: ${DB_USER:payguard}
    password: ${DB_PASSWORD:payguard}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: true
        spring.json.type.mapping: >-
          paymentCreatedEvent:com.payguard.payment.event.PaymentCreatedEvent,
          paymentReviewedEvent:com.payguard.payment.event.PaymentReviewedEvent
    consumer:
      group-id: payment-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: com.payguard.payment.event
        spring.json.type.mapping: >-
          paymentCheckedEvent:com.payguard.payment.event.PaymentCheckedEvent,
          paymentAnalyzedEvent:com.payguard.payment.event.PaymentAnalyzedEvent

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    readinessstate:
      enabled: true
    livenessstate:
      enabled: true

payguard:
  topics:
    payment-created: payment.created
    payment-checked: payment.checked
    payment-analyzed: payment.analyzed
    payment-reviewed: payment.reviewed
  simulator:
    enabled: ${SIMULATOR_ENABLED:false}
    rate-per-sec: ${SIMULATOR_RATE_PER_SEC:1}

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"
