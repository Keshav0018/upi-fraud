spring:
  application:
    name: analytics-service
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: true
        spring.json.type.mapping: >-
          paymentCheckedEvent:com.payguard.analytics.event.PaymentCheckedEvent,
          paymentAnalyzedEvent:com.payguard.analytics.event.PaymentAnalyzedEvent
    consumer:
      group-id: analytics-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: com.payguard.analytics.event
        spring.json.type.mapping: >-
          paymentCreatedEvent:com.payguard.analytics.event.PaymentCreatedEvent,
          paymentReviewedEvent:com.payguard.analytics.event.PaymentReviewedEvent
  ai:
    openai:
      api-key: ${LLM_API_KEY:}
      base-url: ${LLM_BASE_URL:https://api.groq.com/openai}
      chat:
        completions-path: ${LLM_COMPLETIONS_PATH:/v1/chat/completions}
        options:
          model: ${LLM_MODEL:llama-3.3-70b-versatile}
          temperature: 0.3

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    readinessstate:
      enabled: true
    livenessstate:
      enabled: true

payguard:
  topics:
    payment-created: payment.created
    payment-checked: payment.checked
    payment-analyzed: payment.analyzed
    payment-reviewed: payment.reviewed
  ai:
    rate-limit-per-minute: ${AI_RATE_LIMIT_PER_MINUTE:20}
    timeout-seconds: ${AI_TIMEOUT_SECONDS:10}
    max-retries: 1

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"
