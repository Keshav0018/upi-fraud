name: payguard

services:
  postgres:
    image: postgres:16
    container_name: payguard-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-payments_db}
      POSTGRES_USER: ${POSTGRES_USER:-payguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-payguard}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-payguard} -d ${POSTGRES_DB:-payments_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [payguard-network]

  kafka:
    image: apache/kafka:4.0.0
    container_name: payguard-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      CLUSTER_ID: UkAEN6vTQXWsAHmZCYs7CQ
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    ports:
      - "29092:29092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 20s
    networks: [payguard-network]

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: payguard-kafka-ui
    environment:
      KAFKA_CLUSTERS_0_NAME: payguard
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports:
      - "8090:8080"
    depends_on:
      kafka:
        condition: service_healthy
    networks: [payguard-network]

  payment-service:
    build: ./payment-service
    container_name: payguard-payment-service
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-payments_db}
      DB_USER: ${POSTGRES_USER:-payguard}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-payguard}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SIMULATOR_ENABLED: ${SIMULATOR_ENABLED:-true}
      SIMULATOR_RATE_PER_SEC: ${SIMULATOR_RATE_PER_SEC:-1}
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8081/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [payguard-network]

  analytics-service:
    build: ./analytics-service
    container_name: payguard-analytics-service
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.groq.com/openai}
      LLM_MODEL: ${LLM_MODEL:-llama-3.3-70b-versatile}
      LLM_COMPLETIONS_PATH: ${LLM_COMPLETIONS_PATH:-/v1/chat/completions}
      AI_RATE_LIMIT_PER_MINUTE: ${AI_RATE_LIMIT_PER_MINUTE:-20}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-10}
    ports:
      - "8082:8082"
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8082/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [payguard-network]

  api-gateway:
    build: ./api-gateway
    container_name: payguard-api-gateway
    environment:
      PAYMENT_SERVICE_URL: http://payment-service:8081
      ANALYTICS_SERVICE_URL: http://analytics-service:8082
    ports:
      - "8080:8080"
    depends_on:
      payment-service:
        condition: service_healthy
      analytics-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [payguard-network]

  upi-app:
    build:
      context: ./upi-app
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
    container_name: payguard-upi-app
    ports:
      - "3000:80"
    depends_on:
      api-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [payguard-network]

  dashboard:
    build:
      context: ./dashboard
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
    container_name: payguard-dashboard
    ports:
      - "3001:80"
    depends_on:
      api-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [payguard-network]

volumes:
  postgres_data:

networks:
  payguard-network:
    driver: bridge
